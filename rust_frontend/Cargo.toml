[package]
name = "mdrenderer"
version = "1.0.10"
edition = "2021"
description = "MDRenderer - Markdown editor with native Rust frontend + GraalVM DLL backend"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
regex = "1"
rfd = "0.15"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "mdrenderer"
path = "src/main.rs"
